<!DOCTYPE html>
<html>
    <head>
        <title>MH Practice Wiki Requests</title>
        <style>
            #main-content {
                width: 100%;
            }
            #rwq-container {
                /* display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between; */
                width: 100%;
            }
            /* #rwq-id {
                width: 50vw;
            } */
            #main-content > div {
                display: none;
            }
            #main-content.populated {
                & > div {
                    display: block;
                }
            }
            #main-content.populated > #prop-comm-cont {
                display: grid;
                grid-template-columns: 3fr 2fr 3fr;
                /* display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between; */
                width: 100%;
                > :not(:first-child) {
                    margin-left: 2px;
                    padding-left: 5px;
                    border-left: solid 1px black;
                }
            }
            pre#prop-body {
                text-wrap: wrap;
                word-wrap: break-word;
                max-height: 40vh;
                overflow-y: scroll;
            }
            #output {
                /* width: 100%; */
                resize: none;
            }
            #comments {
                display: flex;
                flex-direction: column;
                max-height: 60vh;
            }
            #comments > b {
                flex: 0 1 auto;
            }
            #comments-container {
                flex: 1 1 auto;
                overflow-y: scroll;
            }
            .comment-header {
                text-wrap: wrap;
                overflow-wrap: anywhere;
            }
            pre.comment-body {
                text-wrap: wrap;
                word-wrap: break-word;
            }
        </style>
    </head>
    <body>
        <div id="main-content" class="populated">
            <span id="rwq-container"><input type="text" id="rwq-id"><input type="button" value="Populate" id="populate-button"></span>
            <div id="prop-comm-cont">
                <div id="properties">
                    <b>Request</b><br>
                    <span id="prop-sitename">Sitename: N/A</span><br>
                    <span id="prop-domain">Domain: N/A</span><br>
                    <span id="prop-private">Private: N/A</span><br>
                    <span id="prop-realperson">Real Person: N/A</span><br>
                    <span id="prop-nsfw">NSFW: N/A</span><br>
                    <span>Body:</span>
                    <pre id="prop-body">N/A</pre>
                </div>
                <div id="comments">
                    <b>Comments</b>
                    <div id="comments-container"></div>
                </div>
                <div id="parameters">
                    <b>Template Fields</b><br>
                </div>
            </div>
        </div>
        <div id="output-container">
            <input type="button" value="Copy WikiText" id="copy-button"><br>
            <textarea readonly id="output" rows="10" cols="50"></textarea>
        </div>
        <script>
            /**@type {typeof document.querySelector} */
            const $ = document.querySelector.bind(document);
            /**@type {HTMLTextAreaElement} */
            const OUTPUTWIKITEXT = document.getElementById("output");
            /**@type {HTMLInputElement} */
            const RWQ_ID = document.getElementById("rwq-id");
            RWQ_ID.onkeyup = (ev) => {
                if (ev.code === "Return" || ev.code === "Enter") {
                    $("#populate-button").click();
                }
            };
            /**
             * @typedef {{sitename:string,domain:string,requester:string,private:boolean,realperson:boolean,nsfw:boolean,body:string,comments:{author:string,date:string,body:string}[]}} ReqData
             */
            /**
             * @typedef {"=sitename"|"=pageid"|"=body"|"=private"|"=realperson"|"=nsfw"} CanonParam
             * @typedef {string} TemplateString
             * @typedef {{"break":true}} TemplateBreak
             * @typedef {{"param":string|CanonParam}} TemplateParam
             */
            /**
             * @typedef TemplateContent
             * @type {TemplateString|TemplateBreak|TemplateParam}
             */
            /**
             * @typedef TemplateParamDef
             * @type {{name:string,display?:string,multiline?:boolean,default?:string,"ro-if-udf"?:string[],"nd-if-udf"?:string[],"nd-if-def"?:string[],values?:string[]}}
             */
            /**
             * @typedef TemplateData
             * @type {object}
             * @prop {TemplateContent[]} template
             * @prop {TemplateParamDef[]} params
             */
            /**@type {TemplateData} */
            let template_data;
            /**@type {Record<string,{e:HTMLElement,v:string|null}>} */
            const template_map = {};
            async function main() {
                const template_req = await fetch(`https://${document.location.hostname}/pwr/template?id=default`, {"method":"GET"});
                if (template_req.status === 200) {
                    template_data = await template_req.json();
                    makeTemplateParams();
                }
                document.getElementById("copy-button").onclick = () => {
                    navigator.clipboard.writeText(OUTPUTWIKITEXT.value);
                };
                document.getElementById("populate-button").onclick = async () => {
                    const pageid = RWQ_ID.value.includes("/") ? RWQ_ID.value.slice(RWQ_ID.value.lastIndexOf("/")+1) : RWQ_ID.value;
                    const resp = await fetch(`https://${document.location.hostname}/pwr/scrape?id=${pageid}`, {method:"GET"});
                    if (resp.status !== 200) {
                        alert(`Could not load request data: Error ${resp.status}\n${await resp.text()}`);
                        return;
                    }
                    /**@type {ReqData} */
                    const data = await resp.json();
                    $("span#prop-sitename").textContent = `Sitename: ${data.sitename}`;
                    $("span#prop-domain").textContent = `Domain: ${data.domain}`;
                    $("span#prop-private").textContent = `Private: ${["No","Yes"][Number(data.private)]}`;
                    $("span#prop-realperson").textContent = `Real Person: ${["No","Yes"][Number(data.realperson)]}`;
                    $("span#prop-nsfw").textContent = `NSFW: ${["No","Yes"][Number(data.nsfw)]}`;
                    // /**@type {HTMLDivElement} */
                    // const body = $("div#prop-body");
                    // body.append(...data.body.split("\n").flatMap(l => [l, document.createElement("br")]));
                    $("pre#prop-body").textContent = data.body;
                    $("div#comments-container").replaceChildren(...data.comments.map(makeComment));
                };
            }
            /**
             * @param {{author:string,date:string,body:string}} comment
             * @returns {HTMLElement}
             */
            function makeComment(comment) {
                const d = document.createElement("div");
                d.classList.add("comment");
                const h = document.createElement("b");
                h.classList.add("comment-header");
                h.textContent = `${comment.author} at ${comment.date}`;
                d.append(h);
                const b = document.createElement("pre");
                b.classList.add("comment-body");
                b.textContent = comment.body;
                d.append(b);
                return d;
            }
            function makeTemplateParams() {
                /**@type {HTMLElement[]} */
                const list = [];
                //,ov:string|null,nv:string|null
                /**@type {((pname:string)=>void)[]} */
                const changeHooks = [];
                for (const param of template_data.params) {
                    const ID = list.length;
                    const c = document.createElement("div");
                    template_map[param.name] = {e:c,v:null};
                    list.push(c);
                    c.classList.add("template-parameter");
                    c.id = `tm-param-${ID}`;
                    const l = document.createElement("label");
                    l.htmlFor = `tm-param-${ID}-in`;
                    l.textContent = `${param.display ?? param.name}: `;
                    c.append(l);
                    /**@type {()=>string} */
                    let getValue;
                    let el;
                    if (param.values) {
                        el = document.createElement("select");
                        getValue = () => {
                            const ind = Number(el.value);
                            // catches intended -1 from default and NaN from no selection
                            if (!(ind >= 0)) return null;
                            return param.values[ind];
                        }
                        el.id = `tm-param-${ID}-in`;
                        if (param.default) {
                            const o = document.createElement("option");
                            o.value = "-1";
                            o.defaultSelected = true;
                            o.textContent = param.default;
                            el.append(o);
                        }
                        el.append(...param.values.map((val, i) => {
                            const o = document.createElement("option");
                            o.value = String(i);
                            o.textContent = val;
                            return o;
                        }));
                        c.append(el);
                    } else {
                        if (param.multiline) {
                            el = document.createElement("textarea");
                            c.append(document.createElement("br"));
                        } else {
                            el = document.createElement("input");
                        }
                        getValue = () => el.value;
                        el.id = `tm-param-${ID}-in`;
                        c.append(el);
                    }
                    el.onchange = () => {template_map[param.name].v=getValue();changeHooks.forEach(hook => {hook(param.name);});};
                    changeHooks.push((pname, ov, nv) => {
                        if (param["ro-if-udf"]?.includes(pname)) {
                            c.hidden = param["ro-if-udf"].some(p => template_map[p].v===null);
                            template_map[param.name].v = c.hidden ? null : getValue();
                            if (c.hidden) return;
                        }
                        if (param.values && param.default) {
                            let dis = null;
                            if (param["nd-if-udf"]?.includes(pname)) {
                                // if (c.hidden) {
                                //     c.hidden = !param["nd-if-udf"].some(p => template_map[p].v===null);
                                //     if (!c.hidden) {
                                //         template_map[param.name].v = getValue();
                                //         return;
                                //     }
                                // }
                                dis = param["nd-if-udf"].some(p => template_map[p].v===null);
                            } else if (param["nd-if-def"]?.includes(pname)) {
                                dis = param["nd-if-def"].some(p => template_map[p].v!==null);
                            }
                            if (dis !== null) {
                                const s = c.querySelector("select");
                                s.options.item(0).disabled = dis;
                                if (dis) {
                                    if (s.selectedIndex === 0) {
                                        s.selectedIndex = -1;
                                    }
                                } else if (s.selectedIndex === -1) {
                                    s.selectedIndex = 0;
                                }
                            }
                        }
                    });
                }
                for (const param of template_data.params) {
                    changeHooks.forEach(h => h(param.name));
                }
                $("#parameters").append(...list);
            }
            main();
        </script>
    </body>
</html>
