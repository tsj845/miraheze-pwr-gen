<!DOCTYPE html>
<html>
    <head>
        <title>MH Practice Wiki Requests</title>
        <style>
            :root {
                --main-height: 70vh;
            }
            #main-content {
                width: 100%;
                height: calc(var(--main-height) - 16px);
            }
            #output-container {
                height: calc(100vh - var(--main-height));
            }
            #rwq-container {
                /* display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between; */
                width: 100%;
            }
            /* #rwq-id {
                width: 50vw;
            } */
            #main-content > div {
                display: none;
            }
            #main-content.populated {
                & > div {
                    display: block;
                }
            }
            #main-content.populated > #prop-comm-cont {
                /* display: grid;
                grid-template-columns: 3fr 2fr 3fr; */
                display: flex;
                /* display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between; */
                /* width: 100%; */
                max-width: max(825px, 50vw);
                height: calc(var(--main-height) - 16px - 1.5em);
                > :not(:first-child) {
                    margin-left: 2px;
                    padding-left: 5px;
                    border-left: solid 1px black;
                }
                > * {
                    flex: 1 1 auto;
                }
            }
            #parameters {
                flex: 0 1 !important;
            }
            pre#prop-body {
                text-wrap: wrap;
                word-wrap: break-word;
                /* max-height: 40vh; */
                overflow-y: scroll;
            }
            #output {
                /* width: 100%; */
                resize: none;
                height: calc(100vh - var(--main-height) - 8px - 1.5em);
            }
            #comments {
                display: flex;
                flex-direction: column;
                /* height: calc(var(--main-height) - 16px); */
                /* max-height: 60vh; */
            }
            #comments > b {
                flex: 0 1 auto;
            }
            #comments-container {
                flex: 1 1 auto;
                overflow-y: scroll;
            }
            .comment-header {
                text-wrap: wrap;
                overflow-wrap: anywhere;
            }
            pre.comment-body {
                text-wrap: wrap;
                word-wrap: break-word;
            }
        </style>
    </head>
    <body>
        <div id="main-content" class="populated">
            <span id="rwq-container"><input type="text" id="rwq-id"><input type="button" value="Populate" id="populate-button"></span>
            <div id="prop-comm-cont">
                <div id="properties">
                    <b>Request</b><br>
                    <span id="prop-sitename">Sitename: N/A</span><br>
                    <span id="prop-domain">Domain: N/A</span><br>
                    <span id="prop-private">Private: N/A</span><br>
                    <span id="prop-realperson">Real Person: N/A</span><br>
                    <span id="prop-nsfw">NSFW: N/A</span><br>
                    <span>Body:</span>
                    <pre id="prop-body">N/A</pre>
                </div>
                <div id="comments">
                    <b>Comments</b>
                    <div id="comments-container"></div>
                </div>
                <div id="parameters">
                    <b>Template Fields</b><br>
                </div>
            </div>
        </div>
        <div id="output-container">
            <input type="button" value="Copy WikiText" id="copy-button"><br>
            <textarea readonly id="output" rows="10" cols="50"></textarea>
        </div>
        <script>
            // querySelector has this fun property where if you call it directly it binds
            // to the thing you called it on, but if you save a reference for later it doesn't
            // and starts throwing errors
            /**@type {typeof document.querySelector} */
            const $ = document.querySelector.bind(document);
            /**@type {HTMLTextAreaElement} */
            const OUTPUTWIKITEXT = document.getElementById("output");
            /**@type {HTMLInputElement} */
            const RWQ_ID = document.getElementById("rwq-id");
            RWQ_ID.onkeyup = (ev) => {
                if (ev.code === "Return" || ev.code === "Enter") {
                    $("#populate-button").click();
                }
            };
            // typedefs because any editor worth its salt can read JSDoc, and typescript is way too
            // much of a pain to use, so now I get type hints and code complete without using the
            // pretentious language
            /**
             * @typedef {{sitename:string,domain:string,requester:string,private:boolean,realperson:boolean,nsfw:boolean,body:string,comments:{author:string,date:string,body:string}[]}} ReqData
             */
            /**
             * @typedef {"=sitename"|"=pageid"|"=body"|"=private"|"=realperson"|"=nsfw"} CanonParam
             * @typedef {string} TemplateString
             * @typedef {{"break":true}} TemplateBreak
             * @typedef {{"param":string|CanonParam}} TemplateParam
             */
            /**
             * @typedef TemplateContent
             * @type {TemplateString|TemplateBreak|TemplateParam}
             */
            /**
             * @typedef TemplateParamDef
             * @type {{name:string,display?:string,multiline?:boolean,default?:string,"ro-if-udf"?:string[],"nd-if-udf"?:string[],"nd-if-def"?:string[],values?:string[]}}
             */
            /**
             * @typedef TemplateData
             * @type {object}
             * @prop {TemplateContent[]} template
             * @prop {TemplateParamDef[]} params
             */
            /**@type {TemplateData} */
            let template_data;
            /**@type {Record<string,{e:HTMLElement,v:string|null}>} */
            const template_map = {};
            /**@type {{pageid:string,sitename:string,domain:string,requester:string,private:string,realperson:string,nsfw:string,body:string,comments:{author:string,date:string,body:string}[]}|null} */
            let rwq_data = null;
            // needed to fix the bug where a shared object gets corrupted because rwq_data needs a slightly different format
            /**
             * creates a deep copy of an object
             * @template T
             * @param {T} obj
             * @returns {T}
             */
            function clone(obj) {
                if (obj === null || ["string","number","bigint","boolean","function","symbol","undefined"].includes(typeof obj)) {
                    return obj;
                }
                if (Array.isArray(obj)) return obj.map(clone);
                const c = {};
                for (const key in obj) {
                    c[key] = clone(obj[key]);
                }
                return c;
            }
            async function main() {
                const template_req = await fetch(`https://${document.location.hostname}/pwr/template?id=default`, {"method":"GET"});
                // like all good programmers, we assume it never fails
                if (template_req.status === 200) {
                    template_data = await template_req.json();
                    makeTemplateParams();
                }
                document.getElementById("copy-button").onclick = () => {
                    navigator.clipboard.writeText(OUTPUTWIKITEXT.value);
                };
                document.getElementById("populate-button").onclick = async () => {
                    // the pageid input allows for full or partial urls too, strip that stuff
                    const pageid = RWQ_ID.value.includes("/") ? RWQ_ID.value.slice(RWQ_ID.value.lastIndexOf("/")+1) : RWQ_ID.value;
                    // scrape the page
                    const resp = await fetch(`https://${document.location.hostname}/pwr/scrape?id=${pageid}`, {method:"GET"});
                    // error from the server, oh well
                    if (resp.status !== 200) {
                        alert(`Could not load request data: Error ${resp.status}\n${await resp.text()}`);
                        return;
                    }
                    /**@type {ReqData} */
                    const data = await resp.json();
                    rwq_data = clone(data);
                    // do transformations to get the right data in rwq_data
                    rwq_data.pageid = `Special:RequestWikiQueue/${pageid}`;
                    for (const key of ["private","realperson","nsfw"]) {
                        rwq_data[key] = ["N","Y"][Number(data[key])];
                    }
                    // populate the wiki request properties
                    $("span#prop-sitename").textContent = `Sitename: ${data.sitename}`;
                    $("span#prop-domain").textContent = `Domain: ${data.domain}`;
                    $("span#prop-private").textContent = `Private: ${["No","Yes"][Number(data.private)]}`;
                    $("span#prop-realperson").textContent = `Real Person: ${["No","Yes"][Number(data.realperson)]}`;
                    $("span#prop-nsfw").textContent = `NSFW: ${["No","Yes"][Number(data.nsfw)]}`;
                    $("pre#prop-body").textContent = data.body;
                    $("div#comments-container").replaceChildren(...data.comments.map(makeComment));
                    // render the template
                    renderTemplate();
                };
            }
            /**
             * helper function to render a comment
             * @param {{author:string,date:string,body:string}} comment
             * @returns {HTMLElement}
             */
            function makeComment(comment) {
                const d = document.createElement("div");
                d.classList.add("comment");
                const h = document.createElement("b");
                h.classList.add("comment-header");
                h.textContent = `${comment.author} at ${comment.date}`;
                d.append(h);
                const b = document.createElement("pre");
                b.classList.add("comment-body");
                b.textContent = comment.body;
                d.append(b);
                return d;
            }
            function makeTemplateParams() {
                /**@type {HTMLElement[]} */
                const list = [];
                /**@type {((pname:string)=>void)[]} */
                const changeHooks = [];
                for (const param of template_data.params) {
                    const ID = list.length;
                    const c = document.createElement("div");
                    template_map[param.name] = {e:c,v:null};
                    list.push(c);
                    c.classList.add("template-parameter");
                    c.id = `tm-param-${ID}`;
                    const l = document.createElement("label");
                    l.htmlFor = `tm-param-${ID}-in`;
                    l.textContent = `${param.display ?? param.name}: `;
                    c.append(l);
                    /**@type {()=>string} */
                    let getValue;
                    let el;
                    if (param.values) {
                        el = document.createElement("select");
                        getValue = () => {
                            const ind = Number(el.value);
                            // catches intended -1 from default and NaN from no selection
                            if (!(ind >= 0)) return null;
                            return param.values[ind];
                        }
                        el.id = `tm-param-${ID}-in`;
                        if (param.default) {
                            const o = document.createElement("option");
                            o.value = "-1";
                            o.defaultSelected = true;
                            o.textContent = param.default;
                            el.append(o);
                        }
                        el.append(...param.values.map((val, i) => {
                            const o = document.createElement("option");
                            o.value = String(i);
                            o.textContent = val;
                            return o;
                        }));
                        c.append(el);
                    } else {
                        if (param.multiline) {
                            el = document.createElement("textarea");
                            c.append(document.createElement("br"));
                        } else {
                            el = document.createElement("input");
                        }
                        getValue = () => el.value;
                        el.id = `tm-param-${ID}-in`;
                        c.append(el);
                    }
                    el.onchange = () => {template_map[param.name].v=getValue();changeHooks.forEach(hook => {hook(param.name);});};
                    // some parameters can be hidden depending on the values of others
                    // so this function does that hiding and unhiding
                    changeHooks.push((pname) => {
                        // hide parameters if we can only accept the default value
                        if (param["ro-if-udf"]?.includes(pname)) {
                            c.hidden = param["ro-if-udf"].some(p => template_map[p].v===null);
                            template_map[param.name].v = c.hidden ? null : getValue();
                            // the parameter requiring the default takes precedence
                            if (c.hidden) return;
                        }
                        // the non default checks only work on parameters with enumerated
                        // values
                        if (param.values && param.default) {
                            let dis = null;
                            // if either check passes, we do the same thing
                            if (param["nd-if-udf"]?.includes(pname)) {
                                dis = param["nd-if-udf"].some(p => template_map[p].v===null);
                            } else if (param["nd-if-def"]?.includes(pname)) {
                                dis = param["nd-if-def"].some(p => template_map[p].v!==null);
                            }
                            // using null as a sentinel prevents a bug where
                            // the default can be re-enabled by another hook
                            if (dis !== null) {
                                const s = c.querySelector("select");
                                s.options.item(0).disabled = dis;
                                // ensure that the selection is sensible
                                if (dis) {
                                    if (s.selectedIndex === 0) {
                                        s.selectedIndex = -1;
                                    }
                                } else if (s.selectedIndex === -1) {
                                    s.selectedIndex = 0;
                                }
                            }
                        }
                    });
                }
                // pretend we manually inputted all values so that the template doesn't suddenly change
                // a whole bunch
                for (const param of template_data.params) {
                    changeHooks.forEach(h => h(param.name));
                }
                // push this now so we aren't uselessly calling renderTemplate
                changeHooks.push(renderTemplate);
                $("#parameters").append(...list);
            }
            function renderTemplate() {
                if (rwq_data === null) return;
                OUTPUTWIKITEXT.value = template_data.template.map(content => {
                    if (typeof content === "string") {
                        return content;
                    } else {
                        if (content.break) return "\n";
                        if (content.param[0] === "=") {
                            return rwq_data[content.param.slice(1)];
                        }
                        // I can't be bothered to do proper support on the render side for
                        // unacceptable values, so it'll happily render templates it really shouldn't
                        return template_map[content.param].v ?? (template_data.params.find(v => v.name === content.param).default ?? "UNDEFINED");
                    }
                }).join("");
            }
            main();
        </script>
    </body>
</html>
